name: publish
on:
  schedule:
    - cron: "*/15 * * * *"   # checks the queue every 15 minutes
  workflow_dispatch:
    inputs:
      dry_run: { description: "Dry run (publish nothing)", type: boolean, default: false }
      check_only: { description: "Only verify the token and account", type: boolean, default: false }
permissions:
  contents: write
concurrency: { group: publish, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish due posts
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
          IG_API: facebook
          GRAPH_VERSION: v24.0
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          CHECK_ONLY: ${{ inputs.check_only && '1' || '0' }}
        run: python tools/publish.py
      - name: Save status back to the repo
        if: always()
        run: |
          git config user.name "battwise-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts
          git diff --cached --quiet || (git commit -m "publish: update post status" && git push)
